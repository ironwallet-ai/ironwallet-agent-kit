name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Tag and npm publish
        working-directory: packages/mcp-server
        env:
          IWAGENTKIT_SSH_SIGNING_KEY: ${{ secrets.IWAGENTKIT_SSH_SIGNING_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git config user.email "iwagentkit@users.noreply.github.com"
          git config user.name "iwagentkit"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
          else
            if [ -z "${IWAGENTKIT_SSH_SIGNING_KEY:-}" ]; then
              echo "IWAGENTKIT_SSH_SIGNING_KEY is not set; cannot create a signed tag"
              exit 1
            fi
            KEY_DIR="$(mktemp -d)"
            printf '%s\n' "${IWAGENTKIT_SSH_SIGNING_KEY}" | tr -d '\r' >"${KEY_DIR}/signing"
            chmod 600 "${KEY_DIR}/signing"
            if ! grep -q 'BEGIN OPENSSH PRIVATE KEY' "${KEY_DIR}/signing" && ! grep -q 'BEGIN PRIVATE KEY' "${KEY_DIR}/signing"; then
              echo "IWAGENTKIT_SSH_SIGNING_KEY is not an OpenSSH private key"
              exit 1
            fi
            cp "${GITHUB_WORKSPACE}/.github/iwagentkit.pub" "${KEY_DIR}/signing.pub"
            git config gpg.format ssh
            git config user.signingkey "${KEY_DIR}/signing"
            git config tag.gpgsign true
            if ! ssh-keygen -y -f "${KEY_DIR}/signing" >/dev/null; then
              echo "IWAGENTKIT_SSH_SIGNING_KEY is not readable by OpenSSH"
              exit 1
            fi
            git tag -s -m "${TAG}" "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          if npm view "@ironwallet/mcp-server@${VERSION}" version >/dev/null 2>&1; then
            echo "npm ${VERSION} already published"
          else
            npm publish --access public
          fi
      - name: GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_SCRIPT="${GITHUB_WORKSPACE}/.github/scripts/changelog-section.cjs"
          CHANGELOG="${GITHUB_WORKSPACE}/CHANGELOG.md"
          while IFS= read -r TAG; do
            [ -n "${TAG}" ] || continue
            VERSION="${TAG#v}"
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "release ${TAG} already exists"
              continue
            fi
            TARBALL_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
            SHA256="$(curl -fsSL "${TARBALL_URL}" | sha256sum | awk '{print $1}')"
            {
              node "${NOTES_SCRIPT}" "${VERSION}" "${CHANGELOG}"
              printf '\n## Artifacts\n\n- Source tarball: %s\n- SHA256: `%s`\n' "${TARBALL_URL}" "${SHA256}"
            } > /tmp/release-notes.md
            gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/release-notes.md
            echo "created release ${TAG}"
          done < <(git tag -l 'v[0-9]*' | sort -V)
      - name: Publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SMITHERY_API_KEY:-}" ]; then
            echo "SMITHERY_API_KEY is not set; skip Smithery publish"
            exit 0
          fi
          MCPB="$(bash "${GITHUB_WORKSPACE}/.github/scripts/pack-mcpb.sh" /tmp)"
          npx -y @smithery/cli@4.11.1 mcp publish "${MCPB}" -n ironwallet/mcp-server
      - name: Publish to MCP Registry
        continue-on-error: true
        working-directory: packages/mcp-server
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_PRIVATE_KEY:-}" ]; then
            echo "MCP_PRIVATE_KEY is not set; skip MCP registry publish"
            exit 0
          fi
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          # Stamp provenance into publisher-provided _meta; values come from this
          # run, so nothing is hardcoded in the repo. The registry stores this
          # object verbatim (io.modelcontextprotocol.registry/official is
          # registry output and must not be written here).
          jq --arg commit "${GITHUB_SHA}" --arg run "${GITHUB_RUN_ID}" \
             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '._meta["io.modelcontextprotocol.registry/publisher-provided"].buildInfo =
                { commit: $commit, pipelineId: $run, timestamp: $ts }' \
             server.json > server.json.tmp
          mv server.json.tmp server.json
          ./mcp-publisher login dns --domain ironwallet.io --private-key "${MCP_PRIVATE_KEY}"
          ./mcp-publisher publish || echo "mcp-publisher publish exited $?; still hide superseded versions"
          NAME="$(jq -r .name server.json)"
          ENC="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "${NAME}")"
          curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${ENC}/versions" -o /tmp/mcp-versions.json
          LATEST="$(jq -r '.servers[] | select(._meta["io.modelcontextprotocol.registry/official"].isLatest == true) | .server.version' /tmp/mcp-versions.json)"
          if [ -z "${LATEST}" ]; then
            echo "MCP registry: no isLatest version for ${NAME}" >&2
            exit 1
          fi
          echo "MCP registry latest: ${LATEST}"
          while IFS= read -r ver; do
            [ -n "${ver}" ] || continue
            echo "MCP registry: mark ${ver} deleted (superseded by ${LATEST})"
            ./mcp-publisher status --status deleted --message "Superseded by ${LATEST}" "${NAME}" "${ver}"
          done < <(jq -r '.servers[] | select(._meta["io.modelcontextprotocol.registry/official"].isLatest != true and ._meta["io.modelcontextprotocol.registry/official"].status == "active") | .server.version' /tmp/mcp-versions.json)
